<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Three-stop gradient circle favicons with purple transition</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Vertical, diagonal, and radial gradients going blue through purple to pink, shown at preview, 32px, and 16px sizes.</desc>

<defs>
<linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#6db5f0"/>
<stop offset="0.5" stop-color="#b870e8"/>
<stop offset="1" stop-color="#f08bbe"/>
</linearGradient>
